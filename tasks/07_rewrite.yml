- id: rewrite-001
  category: rewrite
  audience: "新しくチームに入ったエンジニア。社内システムの前提知識はない"
  tags: [rewrite, runbook]
  constraints:
    max_chars: 1200
  prompt: |
    次の社内手順メモを、情報を落とさずに読みやすい手順書に書き直してください。

    ---
    デプロイはmainにマージされたら自動で走るけどstagingは手動なのでJenkinsのdeploy-stagingジョブをパラメータにブランチ名入れて実行する、
    ただしDBマイグレーションがある場合は先にmigrateジョブを同じブランチで流しておかないとアプリが起動失敗するので注意、
    あとstagingは夜間止まってるので朝9時前に実行するときはまずstart-stagingジョブ、終わったらSlackの#deployに書く。
    ---
  must_cover:
    - "本番は main マージで自動、staging は手動(Jenkins の deploy-staging ジョブ、ブランチ名を指定)"
    - "マイグレーションがある場合は同じブランチで migrate ジョブを先に実行"
    - "9時前は start-staging ジョブを先に実行"
    - "完了後に Slack の #deploy に報告"

- id: rewrite-002
  category: rewrite
  audience: "API 利用者(社外の開発者)"
  tags: [rewrite, api-docs]
  constraints:
    max_chars: 1200
  prompt: |
    次の API ドキュメントの説明文を、利用者が迷わないように書き直してください。情報は落とさないでください。

    ---
    このエンドポイントはユーザーの取得を行うことができます。idパラメータを指定することによってそのユーザーを取得することが可能ですが、
    存在しない場合には404が返却されることになります。また、認証されていない場合においては401となりますのでご注意ください。
    なお、削除済みユーザーに関してはinclude_deleted=trueを付与することで取得することができるようになっています。
    ---
  must_cover:
    - "id で指定したユーザーを返す"
    - "存在しない場合 404、未認証の場合 401"
    - "include_deleted=true で削除済みユーザーも取得できる"

- id: rewrite-003
  category: rewrite
  audience: "障害報告を読む開発チームとプロダクトマネージャー"
  tags: [rewrite, postmortem]
  constraints:
    max_chars: 1500
  prompt: |
    次の障害メモを、時系列・原因・影響・対策が分かる障害報告に書き直してください。情報は落とさないでください。

    ---
    14:02頃からAPIの5xxが増えてアラート、14:10に気づいて調査、原因はキャッシュサーバのメモリ枯渇でevictionが多発してDBに負荷集中、
    14:35にキャッシュサーバを再起動して回復、影響は約30分で全ユーザーの一部リクエストが失敗(エラー率最大12%)、
    根本原因は先週入れた新機能でキャッシュキーにタイムスタンプが入っててヒット率が下がってたこと。対策はキー修正とメモリ使用率アラート追加。
    ---
  must_cover:
    - "時系列(14:02 発生、14:10 検知、14:35 復旧)"
    - "直接原因はキャッシュのメモリ枯渇と eviction による DB 負荷"
    - "根本原因はキャッシュキーにタイムスタンプが含まれヒット率が低下していたこと"
    - "影響(約30分、エラー率最大12%)と対策(キー修正、メモリ使用率アラート)"

- id: rewrite-004
  category: rewrite
  audience: "社内の他チームの開発者"
  tags: [rewrite, readme]
  constraints:
    max_chars: 1200
  prompt: |
    次の README の冒頭を、初めて読む開発者がすぐに使い始められるように書き直してください。情報は落とさないでください。

    ---
    このツールは社内のログを集めるやつです。使うには環境変数LOG_TOKENをセットしてからbin/collectを叩くとできますが、
    その前にconfig.yamlを書く必要があってサンプルはconfig.example.yamlにあります。Ruby3.2以上じゃないと動きません。
    あと出力は./outに出ます。質問は#log-toolsまで。
    ---
  must_cover:
    - "前提: Ruby 3.2 以上"
    - "config.example.yaml を元に config.yaml を作る"
    - "環境変数 LOG_TOKEN を設定して bin/collect を実行"
    - "出力先は ./out、問い合わせ先は #log-tools"

- id: rewrite-005
  category: rewrite
  audience: "アプリの利用者(一般的な技術リテラシー)と、それを読むサポート担当"
  tags: [rewrite, error-text]
  constraints:
    max_chars: 600
  prompt: |
    次のエラーメッセージを、利用者が何をすればよいか分かるように書き直してください。
    エンジニアがログで原因を追えるように、内部向けの情報は分けて示してください。

    ---
    エラーが発生しました。処理に失敗しました(code: E4021 / upstream timeout / retryable=true)。システム管理者にお問い合わせください。
    ---
  must_cover:
    - "利用者向けには、時間をおいて再試行すればよいことを伝える"
    - "エラーコード E4021 は問い合わせ時の参照用として残す"
    - "upstream timeout と retryable=true は内部ログ向けに分ける"

- id: rewrite-006
  category: rewrite
  audience: "この PR をレビューする同僚"
  tags: [rewrite, pr-description]
  constraints:
    max_chars: 1000
  prompt: |
    次の Pull Request の説明文を、レビュアーが背景・変更内容・確認方法を把握できる形に書き直してください。情報は落とさないでください。

    ---
    注文一覧が遅いって言われてたのでクエリ直しました。あとついでにN+1もあったので直してます。
    テストは手元で通ってます。インデックス追加のマイグレーション入ってるので本番は注意。
    ---
  must_cover:
    - "背景: 注文一覧の遅延"
    - "変更: クエリの修正、N+1 の解消、インデックス追加のマイグレーション"
    - "確認: 手元でテスト通過"
    - "注意: 本番でのマイグレーション実行"

- id: rewrite-007
  category: rewrite
  audience: "設計レビューに参加するエンジニア"
  tags: [rewrite, design-doc]
  constraints:
    max_chars: 1500
  prompt: |
    次の設計メモを、結論・理由・懸念が分かる設計判断の記録(ADR 風)に書き直してください。情報は落とさないでください。

    ---
    通知の送信、今は同期でやってるけどメール送信が遅くてAPIのレスポンスが悪化してるのでキューに逃がしたい。
    SidekiqかSQSかで迷ったけど既にRedisあるしSidekiqでいいと思う。ただRedis落ちると通知消えるのが心配。
    あとリトライ回数とか決めてない。メール送信APIのレートリミットも考えないと。
    ---
  must_cover:
    - "課題: 同期送信による API レスポンス悪化"
    - "決定: Sidekiq を採用。理由は既存の Redis があること"
    - "懸念: Redis 障害時の通知消失、リトライ方針が未決、メール送信 API のレートリミット"

- id: rewrite-008
  category: rewrite
  audience: "API 利用者(社外の開発者)"
  tags: [rewrite, api-docs]
  constraints:
    max_chars: 1200
  prompt: |
    次の API パラメータ説明を、利用者が迷わないように書き直してください。情報は落とさないでください。

    ---
    limitパラメータは取得件数を指定するためのものとなっており、デフォルトでは20件となっていますが最大で100件まで指定することが可能となっています。
    100を超える値を指定した場合に関しましては、エラーとはならず100件として扱われる形となります。
    offsetについては省略可能であり、省略時は0として扱われることとなっています。なお、limitに0や負の値を指定した場合は400エラーが返されます。
    ---
  must_cover:
    - "limit: 既定 20、最大 100、100 超は 100 として扱う"
    - "limit に 0 や負の値を指定すると 400"
    - "offset: 省略可、既定 0"

- id: rewrite-009
  category: rewrite
  audience: "新しく配属されたエンジニア"
  tags: [rewrite, onboarding]
  constraints:
    max_chars: 1500
  prompt: |
    次の口頭説明の書き起こしを、新メンバー向けの環境構築ガイドに書き直してください。情報は落とさないでください。

    ---
    えっと、まずリポジトリをクローンして、でDockerが必要なんで入ってなかったら入れてください。
    それでmake setupっていうのがあるんでそれ叩くと大体入るんですけど、たまにDBのシードで失敗するんでそのときはmake db-resetしてからもう一回。
    あ、あと.envは.env.sampleをコピーして、Slackに貼ってあるAPIキーを入れてください。起動はmake upで、localhost:8080で見れます。
    ---
  must_cover:
    - "前提: Docker のインストール"
    - "手順: クローン、.env.sample をコピーして API キー(Slack に掲載)を設定、make setup、make up"
    - "シード失敗時は make db-reset してから再実行"
    - "動作確認: localhost:8080"

- id: rewrite-010
  category: rewrite
  audience: "開発チームとプロダクトマネージャー"
  tags: [rewrite, release-notes]
  constraints:
    max_chars: 1000
  prompt: |
    次のコミットログの羅列を、利用者向けのリリースノートに書き直してください。利用者に影響のない内部変更はまとめてください。情報は落とさないでください。

    ---
    - fix typo
    - CSV エクスポートで日本語が文字化けする問題を修正
    - refactor: UserRepository を分割
    - 検索結果の並び順に「更新日時」を追加
    - deps: rails 7.1.3 に更新
    - 管理画面のユーザー削除で確認ダイアログが出ない問題を修正
    - CI の高速化
    ---
  must_cover:
    - "新機能: 検索結果の並び順に更新日時を追加"
    - "修正: CSV エクスポートの文字化け、管理画面のユーザー削除確認ダイアログ"
    - "内部変更(リファクタリング、依存更新、CI、typo)はまとめて記載"

- id: rewrite-011
  category: rewrite
  audience: "夜間に対応する運用担当者"
  tags: [rewrite, runbook]
  constraints:
    max_chars: 1200
  prompt: |
    次のアラート対応メモを、深夜に初めて見る人でも迷わず動ける対応手順書に書き直してください。情報は落とさないでください。

    ---
    queue_depth_highのアラートが来たらまずワーカーが生きてるか見る(ダッシュボードのworkers)。
    死んでたら再起動、生きてるなら特定ジョブが詰まってるはずなのでfailed jobs見て、
    外部API系なら放置でいい(朝になれば復旧する)、それ以外ならエスカレーション。再起動は deploy ツールの restart workers。
    5000超えたら緊急。
    ---
  must_cover:
    - "確認: ダッシュボードの workers でワーカーの生死"
    - "ワーカー停止時: deploy ツールの restart workers で再起動"
    - "稼働中: failed jobs を確認し、外部 API 系なら静観、それ以外はエスカレーション"
    - "キュー深さ 5000 超は緊急"

- id: rewrite-012
  category: rewrite
  audience: "コードを読む将来の開発者"
  tags: [rewrite, comments]
  constraints:
    max_chars: 800
  prompt: |
    次の関数のコメントとドキュメント文字列を、読み手に必要な情報だけが残るように書き直してください。情報は落とさないでください。

    ```python
    # この関数はユーザーを取得する関数です
    def get_active_user(user_id):
        """
        ユーザーを取得します。user_idを受け取ってユーザーを返します。
        ユーザーが存在しない場合、または削除されている場合、または停止されている場合はNoneを返します。
        キャッシュを使うので、キャッシュにあればキャッシュから、なければDBから取ります。キャッシュのTTLは300秒です。
        """
    ```
  must_cover:
    - "削除済み・停止中・存在しない場合は None"
    - "キャッシュ(TTL 300 秒)を優先し、なければ DB から取得"
    - "関数名から自明な説明は省く"

- id: rewrite-013
  category: rewrite
  audience: "サービスの利用者と、問い合わせを受けるサポート担当"
  tags: [rewrite, announcement]
  constraints:
    max_chars: 800
  prompt: |
    次のメンテナンス告知の下書きを、利用者が影響と対応を把握できるように書き直してください。情報は落とさないでください。

    ---
    来週火曜の深夜2時から4時くらいまでDBのバージョンアップのためメンテします。
    その間はログインとかできません。APIも503返します。終わったら特に何もしなくて大丈夫ですが、
    セッションは切れるので再ログインが必要です。延びるかもしれないのでその時はステータスページで。
    ---
  must_cover:
    - "日時: 来週火曜 2:00〜4:00 頃(延長の可能性あり)"
    - "影響: ログイン不可、API は 503"
    - "対応: 終了後に再ログインが必要"
    - "延長時の案内先: ステータスページ"

- id: rewrite-014
  category: rewrite
  audience: "アプリを運用するチーム"
  tags: [rewrite, config-docs]
  constraints:
    max_chars: 1200
  prompt: |
    次の設定項目の説明を、運用者が値を決められるように書き直してください。情報は落とさないでください。

    ---
    WORKER_CONCURRENCYはワーカーの並列数で、デフォルトは5です。大きくするとスループットは上がりますがDBコネクションもその分使うので、
    DB_POOL_SIZE以上にはしないでください(超えるとコネクション待ちが発生します)。メモリは1並列あたりだいたい200MBくらい増えます。
    本番は今10で動いてます。0にするとワーカーが起動しません。
    ---
  must_cover:
    - "既定 5、本番は 10"
    - "DB_POOL_SIZE 以下にする(超えるとコネクション待ち)"
    - "1 並列あたり約 200MB のメモリ増加"
    - "0 にするとワーカーが起動しない"

- id: rewrite-015
  category: rewrite
  audience: "技術ブログの読者(他社のエンジニア)"
  tags: [rewrite, blog]
  constraints:
    max_chars: 1500
  prompt: |
    次の社内向けメモを、社外のエンジニアが読む技術ブログの一節として書き直してください。
    社内固有の名称は一般化し、技術的な学びは落とさないでください。

    ---
    注文サービスのレイテンシ改善の件。p99が1.2sだったのが、商品マスタの参照をリクエストごとにDBから引いてたのをインメモリキャッシュ(5分TTL)にしたら380msになった。
    ただしキャッシュ導入で商品価格の変更が最大5分反映されない問題が出て、営業から苦情。結局、価格だけは毎回DBを見ることにして、p99は450ms。
    教訓: キャッシュ対象は「変わっていい期間」をデータごとに決めてから入れる。
    ---
  must_cover:
    - "改善前 p99 1.2 秒、キャッシュ導入後 380ms、最終的に 450ms"
    - "5 分 TTL のインメモリキャッシュで価格変更が反映されない問題が起きた"
    - "価格のみ毎回 DB 参照に戻した"
    - "教訓: データごとに許容できる鮮度を決めてからキャッシュする"
