- id: review-015
  category: review
  audience: "ログ出力を実装した同僚"
  tags: [logging, security, review]
  constraints:
    max_chars: 1200
  prompt: |
    次のコードに対するレビューコメントを書いてください。セキュリティとログの品質の観点で指摘してください。

    ```python
    def login(request):
        logger.info(f"login attempt: {request.body}")
        user = authenticate(request.json["email"], request.json["password"])
        if not user:
            logger.error("login failed")
            return 401
        logger.info("ok")
        return 200
    ```
  must_cover:
    - "パスワードを含むリクエストボディをそのままログに出している"
    - "失敗ログに原因や対象(メールアドレスのマスク等)がなく調査に使えない"
    - "ログレベルの妥当性(認証失敗は error ではなく warning や info)"
