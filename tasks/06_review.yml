- id: review-001
  category: review
  audience: "このコードを書いたジュニアエンジニア(入社1年目)"
  tags: [ruby, review]
  constraints:
    max_chars: 1200
  prompt: |
    次の Ruby コードに対するコードレビューコメントを書いてください。
    指摘は理由と修正案を添え、重要なものから順に並べてください。相手が萎縮しない書き方にしてください。

    ```ruby
    def send_report(users)
      users.each do |u|
        if u.email != nil && u.email != ""
          report = Report.where(user_id: u.id).order(created_at: :desc).first
          if report != nil
            Mailer.send(u.email, report.body)
          end
        end
      end
    end
    ```
  must_cover:
    - "ループ内で毎回クエリを発行している(N+1)"
    - "nil/空文字チェックは present? などで簡潔に書ける"
    - "メール送信失敗時のエラーハンドリングがない"

- id: review-002
  category: review
  audience: "同僚のバックエンドエンジニア"
  tags: [sql, review]
  constraints:
    max_chars: 1200
  prompt: |
    次の SQL を含む Pull Request に対するレビューコメントを書いてください。
    性能と正しさの両面から指摘し、確認してほしい点を質問の形で含めてください。

    ```sql
    SELECT * FROM orders
    WHERE DATE(created_at) = '2024-06-01'
      AND status != 'cancelled';
    ```
  must_cover:
    - "DATE(created_at) で関数を噛ませるとインデックスが効かない"
    - "SELECT * は必要な列に絞る"
    - "status が NULL の行は != で除外されてしまうこと"

- id: review-003
  category: review
  audience: "フロントエンドチームのメンバー"
  tags: [javascript, review]
  constraints:
    max_chars: 1200
  prompt: |
    次の JavaScript コードに対するレビューコメントを書いてください。
    バグになりうる点を優先し、修正後のコード例を示してください。

    ```javascript
    async function loadAll(ids) {
      const results = [];
      ids.forEach(async (id) => {
        const res = await fetch(`/api/items/${id}`);
        results.push(await res.json());
      });
      return results;
    }
    ```
  must_cover:
    - "forEach は async コールバックを待たないため、空配列が返る"
    - "Promise.all と map で並列に待つ修正案"
    - "fetch のエラー(res.ok の確認)が扱われていない"

- id: review-004
  category: review
  audience: "Python を書く同僚エンジニア"
  tags: [python, review]
  constraints:
    max_chars: 1200
  prompt: |
    次の Python コードに対するレビューコメントを書いてください。
    バグになりうる点を最優先にし、理由と修正案を添えてください。

    ```python
    def add_tag(item, tag, tags=[]):
        tags.append(tag)
        item["tags"] = tags
        return item

    def load_config(path):
        f = open(path)
        return json.load(f)
    ```
  must_cover:
    - "可変オブジェクトをデフォルト引数にすると呼び出し間で共有される"
