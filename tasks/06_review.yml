    - "修正後のコード例"

- id: review-005
  category: review
  audience: "Go を書き始めたチームメンバー"
  tags: [go, review]
  constraints:
    max_chars: 1200
  prompt: |
    次の Go コードに対するレビューコメントを書いてください。
    エラー処理と並行処理の観点を中心に、理由と修正案を示してください。

    ```go
    func fetchAll(urls []string) []string {
        var results []string
        for _, u := range urls {
            go func() {
                resp, _ := http.Get(u)
                body, _ := io.ReadAll(resp.Body)
                results = append(results, string(body))
            }()
        }
        return results
    }
    ```
  must_cover:
    - "goroutine の完了を待っていないため空のスライスが返る(sync.WaitGroup など)"
    - "複数 goroutine から results に同時に append している(データ競合)"
    - "エラーを無視している。resp が nil のときに panic する"
    - "resp.Body を Close していない"

- id: review-006
  category: review
  audience: "TypeScript でフロントエンドを書く同僚"
  tags: [typescript, react, review]
  constraints:
    max_chars: 1200
  prompt: |
    次の React コンポーネントに対するレビューコメントを書いてください。
    バグと性能の観点で指摘し、修正案を添えてください。

    ```tsx
    function UserList({ ids }: { ids: string[] }) {
      const [users, setUsers] = useState<User[]>([]);
      useEffect(() => {
        ids.forEach(async (id) => {
          const u = await fetchUser(id);
          setUsers([...users, u]);
        });
      });
      return <ul>{users.map((u) => <li>{u.name}</li>)}</ul>;
    }
    ```
  must_cover:
    - "useEffect に依存配列がなく毎レンダー実行される"
    - "setUsers がクロージャ内の古い users を参照しており、結果を上書きし合う(関数型更新を使う)"
    - "リスト要素に key がない"
    - "アンマウント後の setState や競合状態への配慮"

- id: review-007
  category: review
  audience: "SQL を書くバックエンドエンジニア"
  tags: [sql, security, review]
  constraints:
    max_chars: 1200
  prompt: |
    次のコードに対するレビューコメントを書いてください。セキュリティ上の問題を最優先にしてください。

    ```python
    def find_users(conn, name):
        sql = f"SELECT id, name FROM users WHERE name LIKE '%{name}%'"
        cur = conn.cursor()
        cur.execute(sql)
        return cur.fetchall()
    ```
  must_cover:
    - "文字列結合による SQL インジェクション"
    - "プレースホルダー(パラメータ化クエリ)への修正例"
    - "LIKE の % や _ のエスケープ、前方一致でないとインデックスが効かない点"

- id: review-008
  category: review
  audience: "シェルスクリプトを書く運用エンジニア"
  tags: [shell, review]
  constraints:
    max_chars: 1200
  prompt: |
    次のシェルスクリプトに対するレビューコメントを書いてください。
    危険な挙動になりうる箇所を優先し、修正案を示してください。

    ```bash
    #!/bin/bash
    BACKUP_DIR=$1
    cd $BACKUP_DIR
    rm -rf *
    cp -r /var/data/ .
    echo "done"
    ```
  must_cover:
    - "引数が空や cd が失敗した場合に、カレントディレクトリで rm -rf * が実行される"
    - "set -euo pipefail と cd の失敗チェック、変数のクォート"
    - "引数の存在確認"

- id: review-009
  category: review
  audience: "Java を書く同僚"
  tags: [java, review]
  constraints:
    max_chars: 1200
  prompt: |
    次の Java コードに対するレビューコメントを書いてください。正しさと可読性の観点で、理由と修正案を添えてください。

    ```java
    public boolean isSameUser(User a, User b) {
        if (a.getEmail() == b.getEmail()) {
            return true;
        }
        return false;
    }

    public List<String> names(List<User> users) {
        List<String> result = new ArrayList<>();
        for (int i = 0; i < users.size(); i++) {
            result.add(users.get(i).getName().toUpperCase());
        }
        return result;
    }
    ```
  must_cover:
    - "文字列の比較に == を使っている(equals を使う。null の考慮)"
    - "if (cond) return true; else return false; は return cond; に簡略化できる"
    - "getName() が null の場合の NullPointerException"

- id: review-010
  category: review
  audience: "API を設計する同僚"
  tags: [api, design, review]
  constraints:
    max_chars: 1200
  prompt: |
    次の REST API 設計案に対するレビューコメントを書いてください。
    一貫性と使いやすさの観点から指摘し、代替案を示してください。

