- id: review-011
  category: review
  audience: "テストを書き始めた同僚"
  tags: [testing, review]
  constraints:
    max_chars: 1200
  prompt: |
    次のテストコードに対するレビューコメントを書いてください。
    テストとしての有効性の観点から指摘し、修正案を添えてください。

    ```ruby
    describe Calculator do
      it "works" do
        calc = Calculator.new
        result = calc.add(1, 2)
        expect(result).to be_truthy
        calc.add(2, 3)
        sleep 1
      end
    end
    ```
  must_cover:
    - "be_truthy では結果の正しさを検証できていない(具体的な値を期待する)"
    - "テスト名が内容を表していない"
    - "検証されない呼び出しと不要な sleep"

- id: review-012
  category: review
  audience: "Dockerfile を書いた同僚"
  tags: [docker, review]
  constraints:
    max_chars: 1200
  prompt: |
    次の Dockerfile に対するレビューコメントを書いてください。
    セキュリティ、イメージサイズ、ビルドキャッシュの観点で指摘し、修正案を示してください。

    ```dockerfile
    FROM node:latest
    COPY . /app
    WORKDIR /app
    RUN npm install
    ENV API_KEY=sk-live-abc123
    CMD node server.js
    ```
  must_cover:
    - "latest タグは再現性がない(バージョンを固定する)"
    - "秘密情報をイメージに焼き込んでいる"
    - "package.json を先にコピーして依存インストール層をキャッシュする"
    - "root で動いている。本番では devDependencies を入れない"

