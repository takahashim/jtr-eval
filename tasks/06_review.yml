- id: review-014
  category: review
  audience: "Pull Request を出した同僚(経験3年程度)"
  tags: [process, review]
  constraints:
    max_chars: 1200
  prompt: |
    次の Pull Request に対するレビューコメントを書いてください。コードの中身ではなく、PR の構成と説明に関する指摘をしてください。

    ---
    タイトル: 修正
    説明: (なし)
    変更ファイル: 48ファイル。バグ修正、リファクタリング、新機能の追加、依存ライブラリの更新、整形の変更が混在。
    ---
  must_cover:
    - "目的別に PR を分割する"
    - "タイトルと説明に変更の目的・背景・確認方法を書く"
