- id: design-001
  category: design
  audience: "中規模 Web サービスのテックリード"
  tags: [architecture, queue]
  constraints:
    max_chars: 1800
  prompt: |
    非同期ジョブ基盤として Redis ベースのキュー(Sidekiq 等)と、マネージドのメッセージキュー(Amazon SQS 等)の
    どちらを採用するか検討しています。比較軸を示したうえで、どういう条件ならどちらを選ぶべきかを説明してください。
  must_cover:
    - "配信保証(at-least-once 等)と重複処理への備え"
    - "運用負荷(Redis の運用・永続化 vs マネージド)"
    - "レイテンシとスループットの違い"
    - "既存スタックとの親和性"

- id: design-002
  category: design
  audience: "API を設計する立場のバックエンドエンジニア"
  tags: [api, rest]
  constraints:
    max_chars: 1500
  prompt: |
    社内向け REST API のページネーションに、オフセット方式とカーソル方式のどちらを使うか決める必要があります。
    それぞれの利点・欠点と、選択の判断基準を説明してください。
  must_cover:
    - "オフセット方式は任意ページへのジャンプができるが、大きなオフセットで遅くなる"
    - "カーソル方式はデータの追加・削除があってもずれにくい"
    - "並び順のキーが一意である必要があること(カーソル方式)"

- id: design-003
  category: design
  audience: "モノリスからの分割を検討しているチームのエンジニア"
  tags: [architecture, microservices]
  constraints:
    max_chars: 1800
  prompt: |
    モノリスをマイクロサービスに分割すべきかどうかを判断するための考え方を説明してください。
    分割で得られるものと失うものを対比し、「まだ分割しないほうがよい」と判断できる条件も示してください。
  must_cover:
    - "分割の動機として組織・デプロイ独立性があること"
    - "分散トランザクションやネットワーク越しの呼び出しによる複雑さの増加"
    - "モジュラーモノリスなど分割以外の選択肢"

- id: design-004
  category: design
  audience: "Web サービスのバックエンドエンジニア"
  tags: [auth, session]
  constraints:
    max_chars: 1800
  prompt: |
    Web アプリの認証状態の保持に、サーバー側セッション(Cookie にセッション ID)と JWT のどちらを使うか検討しています。
    それぞれの長所・短所と、どういう条件ならどちらを選ぶべきかを説明してください。
  must_cover:
    - "JWT は無効化(ログアウト、強制失効)が難しい"
    - "サーバーセッションはストアが必要だがその場で失効できる"
    - "複数サービスやモバイルクライアントとの相性"

- id: design-005
  category: design
  audience: "複数チームで使う共通ライブラリを設計するエンジニア"
  tags: [api, versioning]
  constraints:
    max_chars: 1500
  prompt: |
    公開 API のバージョニングについて、URL にバージョンを入れる方式とヘッダーで指定する方式を比較し、
    破壊的変更をどう扱うべきかの方針を提案してください。
  must_cover:
    - "URL 方式は分かりやすくキャッシュやログで追いやすい"
    - "ヘッダー方式は URL が変わらないが見落としやすい"
    - "後方互換な変更はバージョンを上げずに行い、破壊的変更の際だけ上げる"
    - "旧バージョンの廃止期間と告知"

- id: design-006
  category: design
  audience: "アプリケーション開発チームのエンジニア"
  tags: [database, schema]
  constraints:
    max_chars: 1500
  prompt: |
    設定値や属性を保存するために、列を増やしていく正規化されたテーブル設計と、JSON 列にまとめる設計の
    どちらを採るか迷っています。判断の基準を説明してください。
  must_cover:
    - "検索・集計・制約に使う値は列として持つ"
    - "スキーマが頻繁に変わる、または項目が疎な場合は JSON が向く"
    - "JSON 列はアプリ側でのバリデーションが必要になる"

- id: design-007
  category: design
  audience: "モニタリングを整備するインフラエンジニア"
  tags: [observability, logging]
  constraints:
    max_chars: 1500
  prompt: |
    アプリケーションログを構造化ログ(JSON)にするか、人間が読みやすいテキスト形式のままにするかを検討しています。
    それぞれの利点と、構造化する場合に最低限入れるべきフィールドを説明してください。
  must_cover:
    - "構造化ログは検索・集計・アラートに使いやすい"
    - "テキストは開発中に目で追いやすい"
    - "タイムスタンプ、レベル、リクエスト ID、サービス名などの共通フィールド"

- id: design-008
  category: design
  audience: "フロントエンドチームのリード"
  tags: [frontend, architecture]
  constraints:
    max_chars: 1800
  prompt: |
    新規 Web アプリで、サーバーサイドレンダリング(SSR)と、クライアントサイドのみのレンダリング(SPA)の
    どちらを基本にするか決める必要があります。判断軸と、どちらを選ぶべきかの条件を説明してください。
  must_cover:
    - "初期表示速度と SEO の要件"
    - "サーバー側の運用コストと複雑さ"
    - "ログイン後の操作中心か、公開コンテンツ中心かという用途の違い"

- id: design-009
  category: design
  audience: "バックエンドエンジニア"
  tags: [batch, scheduling]
  constraints:
    max_chars: 1500
  prompt: |
    日次で数百万件を処理するバッチを、1回で全件処理する方式と、小さな単位に分けてキューで処理する方式の
    どちらで作るかを検討しています。それぞれの利点・欠点と判断基準を説明してください。
  must_cover:
    - "失敗時の再実行の範囲(全件やり直しか、失敗分だけか)"
    - "処理時間の見通しとスケールのしやすさ"
    - "順序依存や集計など、分割しにくい処理の存在"

- id: design-010
  category: design
  audience: "社内ツールを作るエンジニア"
  tags: [config, secrets]
  constraints:
    max_chars: 1500
  prompt: |
    アプリケーションの設定値と秘密情報(API キー等)の管理方法について、環境変数、設定ファイル、
    シークレット管理サービスのどれをどう使い分けるべきか方針を説明してください。
  must_cover:
    - "秘密情報はリポジトリに入れない"
    - "環境変数は単純だが、量が増えると管理しづらくローテーションが手作業になる"
    - "シークレット管理サービスは監査やローテーションができるが導入コストがある"

- id: design-011
  category: design
  audience: "テスト戦略を決めるチームリード"
  tags: [testing, strategy]
  constraints:
    max_chars: 1800
  prompt: |
    単体テスト、結合テスト、E2E テストの比率をどう決めるべきかを説明してください。
    E2E を増やしすぎると何が起きるか、逆に単体テストだけでは何が漏れるかを含めてください。
  must_cover:
    - "E2E は実行が遅く不安定になりやすく、保守コストが高い"
    - "単体テストはコンポーネント間の不整合を検出できない"
    - "変更頻度や障害時の影響の大きさに応じて厚くする層を決める"

- id: design-012
  category: design
  audience: "SaaS のバックエンドを設計するエンジニア"
  tags: [multitenancy, database]
  constraints:
    max_chars: 1800
  prompt: |
    マルチテナント SaaS のデータ分離方式として、テナントごとに DB を分ける方式、スキーマを分ける方式、
    同一テーブルに tenant_id 列で分ける方式を比較し、選択基準を説明してください。
  must_cover:
    - "分離の強さとデータ漏えいリスク"
    - "テナント数が増えたときの運用コスト(マイグレーション、バックアップ)"
    - "tenant_id 方式ではクエリの付け忘れを防ぐ仕組みが必要"

- id: design-013
  category: design
  audience: "レガシーシステムの刷新を任されたエンジニア"
  tags: [migration, legacy]
  constraints:
    max_chars: 1800
  prompt: |
    レガシーシステムを一括で作り直す方式と、段階的に置き換える方式(ストラングラーフィグ)を比較し、
    どちらを選ぶべきかの判断基準を説明してください。
  must_cover:
    - "一括刷新は長期間価値が出ず、仕様の見落としリスクが大きい"
    - "段階的置き換えは新旧共存の複雑さと中間層のコストがある"
    - "機能単位で切り出せる境界があるかどうか"

- id: design-014
  category: design
  audience: "API を提供するバックエンドエンジニア"
  tags: [api, errors]
  constraints:
    max_chars: 1500
  prompt: |
    REST API のエラーレスポンスの設計方針を提案してください。
    HTTP ステータスコードの使い分け、レスポンスボディに含める情報、クライアントが機械的に判別できるようにする工夫を含めてください。
  must_cover:
    - "4xx と 5xx の使い分けと、よく使うコードの選び方"
    - "機械可読なエラーコードと人間向けメッセージを分ける"
    - "内部実装の詳細(スタックトレース等)を外に出さない"

- id: design-015
  category: design
  audience: "非同期処理を設計するバックエンドエンジニア"
  tags: [messaging, reliability]
  constraints:
    max_chars: 1500
  prompt: |
    メッセージ処理で失敗したジョブの扱いについて、即時リトライ、指数バックオフ付きリトライ、デッドレターキューを
    どう組み合わせるべきか、方針を説明してください。
  must_cover:
    - "一時的な失敗と恒久的な失敗を区別する"
    - "指数バックオフとジッターで下流への集中を避ける"
    - "上限回数を超えたらデッドレターキューに退避し、監視と再処理の手段を持つ"
